[project]
name = "relay-knowledge-skill-eval"
version = "0.1.0"
description = "Paired Pi/SWE-bench evaluation harness for the relay-knowledge CLI skill."
requires-python = ">=3.12"
dependencies = [
  "datacurve-pier",
  "datasets==4.8.5",
  "docker==7.1.0",
  "pydantic==2.13.4",
  "swebench==4.1.0",
  "typer==0.26.1",
]

[tool.uv.sources]
datacurve-pier = { git = "https://github.com/datacurve-ai/pier.git", rev = "0daf53d3599e58c4506cf0bcff5e12c77dc282d2" }

[project.scripts]
relay-knowledge-skill-eval = "relay_knowledge_skill_eval.cli:app"

[dependency-groups]
dev = [
  "pytest==9.0.3",
  "pytest-cov==7.0.0",
  "ruff==0.14.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay_knowledge_skill_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
