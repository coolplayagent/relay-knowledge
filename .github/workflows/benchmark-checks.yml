name: Benchmark Checks

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: benchmark-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark-regression:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Code repository benchmark regression gate
        run: cargo test --test benchmarks --all-features -- --nocapture

  index-performance-regression:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      RELAY_KNOWLEDGE_SELF_ITERATION_FAST_REPOS: index_performance_many_files
      RELAY_KNOWLEDGE_SELF_ITERATION_FAST_REPO_SETS: __index_performance_ci_only__
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - name: Build self-iteration harness
        run: cargo build --manifest-path tools/self_iteration/Cargo.toml --bin relay-knowledge-self-iterate

      - name: Historical gitlink expansion budget regression
        run: cargo test --lib --all-features historical_reuse_budget_counts_files_expanded_from_gitlinks -- --nocapture

      - name: Prebuild release product outside index-performance timing
        run: cargo build --release --bin relay-knowledge

      - name: Cold and incremental index regression gate
        run: |
          tools/self_iteration/target/debug/relay-knowledge-self-iterate evaluate \
            --workspace . \
            --profile fast \
            --categories performance \
            --use-current-candidate \
            --jobs 4 \
            --repo-jobs 1 \
            --query-jobs 2 \
            --command-timeout-seconds 300
          report="$(ls -t .git/relay-knowledge-self-iteration/reports-v2/manual-evaluate-*.json | head -n 1)"
          jq -e '
            .product_binary_profile == "release" and
            .evaluation.product_binary_profile == "release" and
            (.evaluation.product_binary_path | endswith("target/release/relay-knowledge")) and
            ([.evaluation.gates[] | select(.passed | not)] | length) == 0 and
            any(.evaluation.gates[];
              .name == "code_index_persistence_performance_suite" and .passed == true) and
            any(.evaluation.metrics[];
              .name == "code_index_persistence_performance_suite_ms" and
              .key == true and .budget == 30000 and .value <= .budget) and
            ([.evaluation.cases[] | select(.passed | not)] | length) == 0 and
            ([.evaluation.repositories[] |
              select(.repository == "index_performance_many_files")] | length) == 1 and
            (.evaluation.repositories[] |
              select(.repository == "index_performance_many_files") |
              (.index_summary.cold.task.state == "succeeded") and
              (.index_summary.cold.checkpoint.state == "completed") and
              (.index_summary.incremental.summary.changed_path_count == 3) and
              (.index_summary.incremental.summary.progress.blob_read_count == 2) and
              (.index_summary.incremental.summary.progress.parsed_file_count == 2) and
              ([.commands[] |
                select(.name == "index_performance_many_files_cold_index_completion" or
                       .name == "index_performance_many_files_incremental_index_completion") |
                select(.exit_code == 0)] | length) == 2 and
              ([.metrics[] |
                select(.name == "index_performance_many_files_cold_index_ms" or
                       .name == "index_performance_many_files_cold_register_index_ms" or
                       .name == "index_performance_many_files_incremental_index_ms" or
                       .name == "index_performance_many_files_initialization_incremental_index_ms") |
                select(.budget != null and .value <= .budget)] | length) == 3)
          ' "$report"

  agent-workflow-regression:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      RELAY_KNOWLEDGE_SELF_ITERATION_FAST_REPOS: agent_workflow_fixture
      RELAY_KNOWLEDGE_SELF_ITERATION_FAST_REPO_SETS: __agent_workflow_ci_only__
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - name: Build self-iteration harness
        run: cargo build --manifest-path tools/self_iteration/Cargo.toml --bin relay-knowledge-self-iterate

      - name: Coding-agent workflow regression gate
        run: |
          tools/self_iteration/target/debug/relay-knowledge-self-iterate evaluate \
            --workspace . \
            --profile fast \
            --categories agent_workflows \
            --use-current-candidate \
            --jobs 2 \
            --repo-jobs 1 \
            --query-jobs 1 \
            --command-timeout-seconds 180
          report="$(ls -t .git/relay-knowledge-self-iteration/reports-v2/manual-evaluate-*.json | head -n 1)"
          jq -e '
            [["agent_workflow_fixture", "agent_definition_to_answer_context"],
             ["agent_workflow_fixture", "agent_cross_language_impact_trace"],
             ["agent_workflow_fixture", "agent_one_call_codegraph_context_pack"],
             ["agent_workflow_fixture", "agent_config_freshness_trace"]] as $expected |
            ([.evaluation.cases[] |
              select(.repository == "agent_workflow_fixture") |
              [.repository, .case_id]] | sort) as $actual |
            .profile == "fast" and
            .evaluation.profile == "fast" and
            .selected_categories == ["agent_workflows"] and
            .evaluation.selected_categories == ["agent_workflows"] and
            ((.evaluation.skipped_suites // []) | index("agent_workflows")) == null and
            ([.evaluation.repositories[] |
              select(.repository == "agent_workflow_fixture")] | length) == 1 and
            ($actual == ($expected | sort)) and
            (($actual | unique | length) == 4) and
            ([.evaluation.gates[] | select(.passed | not)] | length) == 0 and
            ([.evaluation.cases[] | select(.passed | not)] | length) == 0 and
            ([.evaluation.metrics[] | select(.name | startswith("agent_"))] | length) > 0 and
            ([.evaluation.metrics[] | select((.name | startswith("agent_")) and .key and (.budget != null) and
              ((.lower_is_better and (.value > .budget)) or
               ((.lower_is_better | not) and (.value < .budget))))] | length) == 0
          ' "$report"
