name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Validate current release pages
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          for language in en zh; do
            release_page="pages/${language}/releases/${version}.html"
            test -f "$release_page"
            grep -Fq "./releases/${version}.html" "pages/${language}/index.html"
            grep -Fq "releases/tag/v${version}" "$release_page"
            grep -Fq "crates.io/crates/relay-knowledge/${version}" "$release_page"
          done

      - name: Build static Pages site
        run: |
          mkdir -p _site
          cp -R pages/. _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
